<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191816">
<title>借伞 · 回信</title>
<style>
:root{color-scheme:dark;--ink:#f1e4cc;--dim:#b4a99a;--line:#54493d;--copper:#d59c70}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#181715;color:var(--ink)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% 27%,#2b2722 0,#1d1b18 45%,#151513 88%);min-height:100svh;display:grid;align-content:center}
main{width:min(92vw,1160px,calc((100svh - 187px) * 1.7778));margin:18px auto 16px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:17px;gap:20px;padding:0 2px}
.titles{display:flex;align-items:baseline;gap:17px}
h1{font:600 clamp(32px,3.1vw,49px)/1 "Songti SC","STSong","Noto Serif CJK SC",serif;letter-spacing:.10em;margin:0}
.english{font:italic 19px/1.1 "Baskerville","Iowan Old Style",Georgia,serif;color:#ccae89;letter-spacing:.015em}
.format{font-size:12px;letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.projection{position:relative;background:#161511;border:1px solid #65513a;border-radius:3px;overflow:hidden;box-shadow:0 14px 42px #08080766}
canvas{width:100%;aspect-ratio:16/9;display:block;outline-offset:-4px;touch-action:none;cursor:grab;background:#24221e}
canvas:active{cursor:grabbing}
canvas:focus-visible,button:focus-visible{outline:2px solid #f3c397;outline-offset:-3px}
.desk{display:flex;align-items:center;gap:13px;padding:12px 0 8px;min-height:49px}
button{border:0;background:none;font:inherit;font-size:13px;line-height:1;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 5px;min-height:32px;white-space:nowrap;cursor:pointer;border-radius:3px}
button.primary{border:1px solid #b3916f;background:#e3c9a5;color:#30271f;padding:8px 13px;font-weight:600;min-width:82px}
button svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button .solid{fill:currentColor;stroke:none}
button:disabled{opacity:.4;cursor:default}
button[hidden], [hidden]{display:none!important}
@media(hover:hover){button:not(:disabled):hover{background:#3a332c}button.primary:hover{background:#eed8ba}}
.track{flex:1;height:2px;background:#51493d;overflow:hidden;min-width:20px}
.track i{display:block;width:100%;height:100%;background:#c28d60;transform-origin:left;transform:scaleX(0)}
.clock{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;letter-spacing:.035em;color:#c8bbab;white-space:nowrap}
.clock span{color:#eee0c8}
.note{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:2px 2px 0;color:var(--dim);font-size:12px;line-height:1.55;letter-spacing:.04em}
.note p{margin:0}.state{color:#d8b990;white-space:nowrap}.mobile-tip{display:none}
main:fullscreen{width:100%;margin:0;padding:8px 12px;background:#131311;display:flex;flex-direction:column;justify-content:center}
main:fullscreen header{display:none}main:fullscreen .projection{min-height:0;width:min(100%,calc((100dvh - 87px)*1.7778));margin:0 auto;border:0}
main:fullscreen .desk,main:fullscreen .note{width:min(100%,calc((100dvh - 87px)*1.7778));align-self:center}
@media(max-width:760px){main{width:94vw;margin:20px auto}.english{font-size:16px}.format{font-size:10px}header{margin-bottom:13px}.desk{gap:8px}.note{font-size:11px}}
@media(max-width:600px) and (orientation:portrait){body{align-content:start}main{width:100%;margin:clamp(25px,7vh,72px) 0 20px}header{padding:0 18px 3px}.titles{gap:12px}h1{font-size:37px}.english{font-size:15px}.format{font-size:10px;letter-spacing:.03em}.projection{border-left:0;border-right:0;border-radius:0}canvas{aspect-ratio:1.28}.desk{padding:11px 12px 5px;gap:8px}.note{padding:3px 13px;align-items:flex-start}.desktop-tip,.full-label{display:none}.mobile-tip{display:inline}.clock{font-size:10px}.desk button{min-height:40px}.desk button.primary{min-width:72px;padding:7px 9px}.note p{max-width:69%}}
@media(max-height:540px) and (orientation:landscape){main{width:min(96vw,calc((100svh - 68px) * 1.7778));margin:4px auto}header{margin:2px 0 4px}h1{font-size:20px}.english{font-size:12px}.format{font-size:9px}.desk{padding:2px 0;min-height:30px;gap:9px}.desk button{min-height:26px;padding:4px 6px;font-size:11px}.note{font-size:9px;line-height:1.15}.desk button svg{width:13px;height:13px}}
@media(max-width:600px) and (min-height:700px) and (orientation:portrait){canvas{aspect-ratio:1.12}}
</style>
</head>

<main>
  <header><div class="titles"><h1>借伞 · 回信</h1><span lang="en" class="english">A Paper Reply</span></div><span class="format">互动纸上电影</span></header>
  <div class="projection" id="stageFrame">

<script>
'use strict';
const FILM = 26;
const STEP = 1 / 90;
const FLOOR = 417;
const RADIUS = 98;
const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const damp = (a, b, k, dt) => mix(a, b, 1 - Math.exp(-k * dt));
const towards = (a, b, n) => a + clamp(b-a, -n, n);
const pulse = (a,b,c,d,x) => smooth(a,b,x) * (1-smooth(c,d,x));
const pt = (x,y) => ({x,y});
const blendPoint = (a,b,k) => pt(mix(a.x,b.x,k),mix(a.y,b.y,k));
function timeline(t, stops) {
  for (let i=1; i<stops.length; i++) {
    if (t<=stops[i][0]) return mix(stops[i-1][1],stops[i][1],smooth(stops[i-1][0],stops[i][0],t));
  }
  return stops[stops.length-1][1];
}
const showX=[[0,421],[7.9,421],[11.15,564],[11.65,564],[12.08,790],[13.95,790],[15.65,688],[20,688]];
const showY=[[0,209],[8,209],[11.15,216],[11.65,216],[12.12,188],[13.9,188],[15.45,215],[16.25,215],[17.85,243],[20,243]];
function newStory() {
  const x=-78;
  return {t:0, manual:false, cameraHand:0, u:{x:421,y:209,tx:421,ty:209,vx:0,tilt:0,open:0},
    kid:{x,v:0,yaw:1,heading:1,headYaw:1,mode:'arrival',since:0,mark:null,
      feet:[0,1].map(i=>({x:x+(i?10:-7),y:FLOOR,side:i,active:false,p:0,arc:0,bootYaw:1})),
      nextFoot:0,guard:.19,offer:0,look:0,lift:0,crouch:0,brake:0,bob:0,
      saved:false,flinchAt:-100,wasDry:false,gazeDown:0,anchored:false},
    rings:[],encore:null,playful:false};
}
function steer(s,x,y) {
  if(!s.gift){s.replyAt=Math.max(10.8,s.t+2.35);s.releaseStarted=null;}
  s.manual=true; s.u.tx=clamp(x,103,897); s.u.ty=clamp(y,150,243);
  if(s.encore) {
    const f=s.encore.foot;
    if(f && f.y<FLOOR && !f.active) {
      f.from=f.x;f.to=f.x;f.fromY=f.y;f.arc=0;f.duration=.14;f.p=0;f.active=true;

}
function guideUmbrella(s,dt) {
  const u=s.u;
  if (!s.manual) { u.tx=timeline(s.t,showX); u.ty=timeline(s.t,showY); }
  const oldX=u.x;
  // The projection follows a short drag with almost no lag. Its tilt carries the momentum.
  u.x=damp(u.x,u.tx,24,dt); u.y=damp(u.y,u.ty,22,dt);
  u.vx=damp(u.vx,(u.x-oldX)/dt,15,dt);

  u.open=s.manual?damp(u.open,1,10,dt):aperture;

function canopyHem(u,worldX) {
  const marks=[-98,-52,0,52,98], ys=[1,3,7,3,1];
  const dx=clamp((worldX-u.x)/Math.cos(u.tilt),-98,98);
  let i=0; while(i<3 && dx>marks[i+1]) i++;
  const k=(dx-marks[i])/(marks[i+1]-marks[i]);
  const by=(1-k)*(1-k)*ys[i]+2*(1-k)*k*(-12)+k*k*ys[i+1];
  return u.y+dx*Math.sin(u.tilt)+by*Math.cos(u.tilt);
}
// Middle of the painted shaft, on the same quadratic as its visible outline.
function shaftGrip(u) {
  const t=.72, a=1-t;
  const x=(-2*a*a-10*a*t-14*t*t)*u.open;
  const y=(-32*a*a+24*a*t+51*t*t)*(.56+.44*u.open);
  return pt(u.x+x*Math.cos(u.tilt)-y*Math.sin(u.tilt),
    u.y+(1-u.open)*58+x*Math.sin(u.tilt)+y*Math.cos(u.tilt));
}
function change(k,mode,t) { k.mode=mode; k.since=t; }
function stroll(k,destination,maxSpeed,accel,dt) {
  const delta=destination-k.x;
  if(Math.abs(delta)<.25){k.v=towards(k.v,0,accel*dt);k.x+=k.v*dt;return;}
  const desired=Math.sign(delta)*Math.min(maxSpeed,Math.sqrt(2*accel*Math.abs(delta))*.88);
  k.v=towards(k.v,desired,accel*dt);
  if (Math.abs(k.v*dt)>Math.abs(delta) && k.v*delta>=0) { k.x=destination; k.v=0; }

}
function landing(s,x,y,power,extra=false) {
  s.rings.push({x,y,power,born:s.t,extra});
}
function stepFeet(s,dt) {
  const k=s.kid, speed=Math.abs(k.v), dir=Math.sign(k.v)||k.heading;

}
function startEncore(s) {

}
function encoreMotion(s,dt) {
  const e=s.encore,k=s.kid;

      const feet=k.feet;

  }

function poppies(c,s){
  const blooms=s.gift?.flowers;if(!blooms)return;
  for(let i=0;i<blooms.length;i++){
    const k=smooth(0,.88,s.t-blooms[i]);if(!k)continue;
    const x=s.kid.x+32+[-2,11,-11][i],base=FLOOR+2,h=[30,22,17][i]*k;
    const y=base-h, tip=x+Math.sin(s.t*1.8+i)*1.5;
    c.beginPath();c.moveTo(x,base);c.quadraticCurveTo(x-3,base-h*.52,tip,y);c.lineWidth=1.5;c.strokeStyle='#536a51';c.stroke();
    triangle(c,pt(x-1,base-h*.4),pt(x-8,base-h*.67),pt(x-3,base-h*.37),'#68805e');
    const f=smooth(.38,1,k);if(!f)continue;
    for(let j=0;j<4;j++){const a=-2.9+j*.84;oval(c,tip+3.4*Math.cos(a)*f,y+2.6*Math.sin(a)*f,3.5*f,2.8*f,['#b83f30','#d65b40','#ee7755','#cc4938'][j]);}
    oval(c,tip,y,1.4*f,1.1*f,'#583a2e');
  }
}
function memoryPainting(c,g){
  c.save();c.beginPath();c.rect(-19,-11.5,38,22);c.clip();
  c.drawImage(setArt.street,-19,-11.5,38,22);
  c.fillStyle='rgba(239,222,178,.27)';c.fillRect(-19,-11.5,38,22);
  // Normalise by one scale in both axes, retaining the bends of the viewer's gesture.
  const route=g.route;
  if(route.length>1){
    const xs=route.map(p=>p.x),ys=route.map(p=>p.y);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const scale=Math.min(29/Math.max(80,x1-x0),7.4/Math.max(58,y1-y0));
    c.beginPath();route.forEach((p,i)=>{const x=2+(p.x-(x0+x1)/2)*scale,y=-6.15+(p.y-(y0+y1)/2)*scale;if(i)c.lineTo(x,y);else c.moveTo(x,y);});
    c.setLineDash([.52,.38]);c.lineWidth=.22;c.strokeStyle='#a94935';c.stroke();c.setLineDash([]);
  }
  c.save();c.translate(-6.6,3.2);c.rotate(-.065);c.scale(.098,.098);
  shape(c,'M0 -32 L0 54 Q-1 69 -12 67 Q-19 65 -17 58',null,'#65523d',3);
  c.drawImage(velvet,-108,-75,216,105);c.restore();
  for(let j=0;j<3;j++){
    const x=10+j*1.65,h=[1.9,3.2,2.5][j];
    line(c,pt(x,9.6),pt(x+.18,9.6-h),'#637454',.12);
    oval(c,x+.18,9.6-h,.52,.28,j===1?'#ba4832':'#cb6040');
  }
  c.restore();
}
function saveLetter(g){
  if(!g?.flowers.length)return;
  const sheet=buffer(1280,850),c=sheet.getContext('2d');
  c.fillStyle='#eddfc4';c.fillRect(0,0,1280,850);
  const rng=randomInk(1867);for(let i=0;i<24000;i++){c.fillStyle=rng()>.55?'rgba(105,84,55,.12)':'rgba(255,251,223,.38)';c.fillRect(rng()*1280,rng()*850,1.4,.85);}
  c.save();c.translate(640,382);c.scale(30,30);memoryPainting(c,g);c.restore();
  c.strokeStyle='#9c8d75';c.lineWidth=1;c.strokeRect(70,37,1140,660);
  c.fillStyle='#674d40';c.font='30px "Songti SC",serif';c.fillText('你撑过的那段路，我画下来了。',72,771);
  c.textAlign='right';c.font='20px "Songti SC",serif';c.fillText('借伞 · 回信',1208,777);
  sheet.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='借伞-给你的回信.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),4500);},'image/png');
}

const $=id=>document.getElementById(id);
const canvas=$('film'),playBtn=$('play'),againBtn=$('again'),encoreBtn=$('encore');
const less=matchMedia('(prefers-reduced-motion: reduce)');
let scene=newStory(), posterScene=null, mode='loading', playing=false, lastStamp=0, debt=0, request=0;
let dragView=null,holding=null, renderedPhase='', secondShown=-1, completed=false;
const pressed=new Set();
function fit() {
  const b=canvas.getBoundingClientRect();
  const scale=Math.min(devicePixelRatio||1,1.65,1536/b.width,960/b.height);
  const w=Math.max(2,Math.round(b.width*scale)),h=Math.max(2,Math.round(b.height*scale));
  if(canvas.width!==w||canvas.height!==h) {canvas.width=w;canvas.height=h;}
  if(room) paint(canvas,mode==='ready'?posterScene:scene,mode==='ready',less.matches);
}
function status() {
  const phase=mode==='ready'?'ready':!playing?'paused':scene.gift?.landed!=null?'returned':scene.gift&&scene.t-scene.gift.born>5.2?'catch':scene.gift?'air':scene.manual?'handling':'show';
  if(phase!==renderedPhase) {
    $('state').textContent=({ready:'准备开场',air:'风筝离开了画纸',catch:'接风筝',returned:'雨回到了银幕里',paused:'已暂停',encore:'片尾小动作',open:'片尾 · 自由移伞',handling:'伞在你手里',show:'放映中'})[phase];
    $('playIcon').setAttribute('d',playing?'M5 3.5h3.5v13H5zM11.5 3.5H15v13h-3.5z':'M5 3.5 16 10 5 16.5Z');
    $('playLabel').textContent=playing?'暂停':mode==='ready'?'开始放映':'继续';
    $('hint').textContent=phase==='catch'?'按住红风筝，拖到落下的水滴下方。方向键也能移动。':phase==='returned'?'看孩子鞋尖旁的水洼。':phase==='air'?'跟着红风筝看。':'按住画面左右移伞，往下拖可压低。';
    againBtn.disabled=mode==='ready';
    encoreBtn.hidden=!scene.gift?.flowers.length;
    encoreBtn.disabled=!!scene.encore;
    renderedPhase=phase;
  }
  encoreBtn.hidden=!scene.gift?.flowers.length;
  encoreBtn.disabled=false;
  const sec=Math.min(FILM,Math.floor(scene.t+1e-7));
  if(sec!==secondShown){$('elapsed').textContent='00:'+String(sec).padStart(2,'0');secondShown=sec;}
  $('progress').style.transform='scaleX('+clamp(scene.t/FILM)+')';
}
function runFrame(now) {
  request=0;
  if(!playing || document.hidden) {lastStamp=0;return;}
  // Catch up after a missed paint without changing the length of the screening.
  // A tab returning from the background starts with a fresh clock below.
  if(lastStamp)debt+=Math.min((now-lastStamp)/1000,2);
  lastStamp=now;
  while(debt+1e-9>=STEP) {
    if(pressed.size) {
      const x=(pressed.has('ArrowRight')?1:0)-(pressed.has('ArrowLeft')?1:0);
      const y=(pressed.has('ArrowDown')?1:0)-(pressed.has('ArrowUp')?1:0);
      if(x||y) {
        const g=scene.gift;
        if(g && scene.t-g.born>=5.2)holdGift(scene,(g.pilot?g.tx:g.x)+x*490*STEP,(g.pilot?g.ty:g.y)+y*360*STEP);
        else steer(scene,scene.u.tx+x*245*STEP,scene.u.ty+y*102*STEP);
      }
    }
    tick(scene);debt-=STEP;
  }
  if(!completed&&scene.t>=FILM-1e-7)completed=true;
  paint(canvas,scene,false,less.matches,dragView);status();request=requestAnimationFrame(runFrame);
}
function resume() {
  if(mode==='loading'||playing)return;
  mode='live';playing=true;lastStamp=0;debt=0;status();
  if(!request)request=requestAnimationFrame(runFrame);
}
function pauseFilm() {
  if(!playing)return;playing=false;lastStamp=0;pressed.clear();
  if(request)cancelAnimationFrame(request);request=0;status();
}
function restart() {
  pauseFilm();scene=newStory();completed=false;holding=null;dragView=null;renderedPhase='';resume();
  paint(canvas,scene,false,less.matches);
}
function localPoint(ev) {
  const b=canvas.getBoundingClientRect();
  const x=(ev.clientX-b.left)*canvas.width/b.width,y=(ev.clientY-b.top)*canvas.height/b.height;
  return pt(((x-viewing.tx)/viewing.factor-SX)/XS,((y-viewing.ty)/viewing.factor-SY)/YS);
}
function releasePointer() {
  if(dragView)dragView.released=scene.t;
  holding=null;
}
function moveUmbrella(ev) {
  const h=holding;if(!h||ev.pointerId!==h.id)return;
  const dx=ev.clientX-h.sx,dy=ev.clientY-h.sy;
  if(!h.moved && Math.hypot(dx,dy)<3)return;
  if(h.poster){
    scene=structuredClone(posterScene);h.poster=false;resume();
  }
  h.moved=true;
  if(h.kite){holdGift(scene,h.ux+dx*h.kx,h.uy+dy*h.ky);return;}
  if(scene.gift&&scene.t-scene.gift.born>=5.2)return;
  steer(scene,h.ux+dx*h.kx,h.uy+dy*h.ky);
}
canvas.addEventListener('pointerdown',ev=>{
  if(mode==='loading'||holding||ev.button!==0)return;
  ev.preventDefault();canvas.focus({preventScroll:true});
  const poster=mode==='ready',shown=poster?posterScene:scene;
  const p=localPoint(ev),u=shown.u,b=canvas.getBoundingClientRect();
  const roomX=SX+p.x*XS,roomY=SY+p.y*YS;
  const g=shown.gift;
  if(g && shown.t-g.born>=5.2){
    if(!playing)resume();
    if(g.landed!==null || Math.abs(roomX-g.x)>Math.max(78,g.scale*36)||Math.abs(roomY-g.y)>Math.max(83,g.scale*42))return;
    holdGift(scene,g.x,g.y);dragView={...viewing,released:null,kite:true};
    holding={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,ux:g.x,uy:g.y,kite:true,grab:true,moved:false,kx:canvas.width/b.width/viewing.factor,ky:canvas.height/b.height/viewing.factor};
    canvas.setPointerCapture(ev.pointerId);return;
  }
  const frontX=359+(u.x-421)*.55,frontY=876+(u.y-209)*.48+(1-u.open)*130;
  const front=u.open>.5 && Math.abs(roomX-frontX)<174 && roomY>frontY-124 && roomY<frontY+120;
  const shadow=Math.abs(p.x-u.x)<108 && p.y>=u.y-75 && p.y<=u.y+71;
  dragView={...viewing,released:null};
  holding={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,ux:u.x,uy:u.y,
    kx:canvas.width/b.width/viewing.factor/(front?.55:XS),
    ky:canvas.height/b.height/viewing.factor/(front?.48:YS),poster,moved:false,grab:front||shadow};
  if(!poster) {if(!playing)resume();if(holding.grab)steer(scene,u.x,u.y);}
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove',moveUmbrella);
canvas.addEventListener('pointerup',ev=>{
  if(!holding||holding.id!==ev.pointerId)return;
  moveUmbrella(ev);
  if(holding.poster){dragView=null;resume();}
  else if(!holding.moved&&!holding.grab){const p=localPoint(ev);steer(scene,p.x,p.y+22);}
  releasePointer();
});
canvas.addEventListener('lostpointercapture',()=>{if(holding)releasePointer();});
canvas.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',ev=>{
  if(mode==='loading'||ev.altKey||ev.ctrlKey||ev.metaKey)return;
  if(ev.key.startsWith('Arrow')) {
    ev.preventDefault();if(!playing)resume();pressed.add(ev.key);
    if(!ev.repeat) {
      const dx=ev.key==='ArrowLeft'?-11:ev.key==='ArrowRight'?11:0,dy=ev.key==='ArrowUp'?-5:ev.key==='ArrowDown'?5:0;
      const g=scene.gift;
      if(g && scene.t-g.born>=5.2)holdGift(scene,g.x+dx,g.y+dy);else steer(scene,scene.u.tx+dx,scene.u.ty+dy);
    }
  } else if(ev.code==='Space' && ev.target.tagName!=='BUTTON') {
    ev.preventDefault();if(!ev.repeat)playing?pauseFilm():resume();
  }
});
window.addEventListener('keyup',ev=>pressed.delete(ev.key));
window.addEventListener('blur',()=>{pressed.clear();releasePointer();});
document.addEventListener('visibilitychange',()=>{
  lastStamp=0;debt=0;pressed.clear();
  if(!document.hidden && playing&&!request)request=requestAnimationFrame(runFrame);
});
playBtn.addEventListener('click',()=>playing?pauseFilm():resume());
againBtn.addEventListener('click',restart);
encoreBtn.addEventListener('click',()=>saveLetter(scene.gift));
const frame=document.querySelector('main'),full=$('full');
if(!document.fullscreenEnabled)full.hidden=true;
full.addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await frame.requestFullscreen();}
  catch{full.hidden=true;}
});
document.addEventListener('fullscreenchange',()=>{full.setAttribute('aria-label',document.fullscreenElement?'退出全屏':'全屏');fit();});
new ResizeObserver(fit).observe(canvas);
less.addEventListener?.('change',fit);
async function openHouse() {
  const data=JSON.parse($('plates').textContent),images={};
  await Promise.all(Object.entries(data.images).map(async([name,url])=>{
    const im=new Image();im.src=url;await im.decode();images[name]=im;
  }));
  prepareSet(images,data.aperture);
  posterScene=newStory();for(let i=0;i<6.55/STEP;i++)tick(posterScene);
  mode='ready';playBtn.disabled=false;fit();status();canvas.dataset.ready='yes';
}
openHouse().catch(()=>{$('state').textContent='装片失败，请重新打开文件';});
